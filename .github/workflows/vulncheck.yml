name: Vulncheck

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Advisories are published independently of our commits; check weekly so a
  # new one is caught without waiting for the next change.
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      # Fails when a known vulnerability is reachable from our code, including
      # ones in the Go standard library of the pinned toolchain.
      - name: govulncheck
        run: |
          (cd web-app && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...)
          (cd nftables-sync-client && go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 ./...)
