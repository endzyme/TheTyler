name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "docs/**"
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.work
          cache: true
          cache-dependency-path: "**/go.sum"

      - name: Build web-app
        run: go build -o /tmp/thetyler ./web-app/cmd/web-app

      - name: Build nftables-sync-client
        run: go build -o /tmp/nftables-sync-client ./nftables-sync-client/cmd/nftables-sync-client

      - name: Vet
        run: |
          go vet ./web-app/...
          go vet ./nftables-sync-client/...

      - name: Test
        run: |
          go test ./web-app/...
          go test ./nftables-sync-client/...

