version: 2

project_name: the-tyler

builds:
  - id: web-app
    main: ./web-app/cmd/web-app
    binary: thetyler
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

  - id: nftables-sync-client
    main: ./nftables-sync-client/cmd/nftables-sync-client
    binary: nftables-sync-client
    env:
      - CGO_ENABLED=0
    goos:
      - linux
    goarch:
      - amd64
      - arm64
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    # Specifying `files` overrides goreleaser's defaults, so the license and
    # readme are re-listed explicitly alongside the bundled updater script.
    files:
      - LICENSE
      - README.md
      - src: scripts/the-tyler-update.sh
        dst: the-tyler-update.sh
        info:
          mode: 0755

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "Merge pull request"
      - "Merge branch"
