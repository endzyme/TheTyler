syntax = "proto3";

package tyler.v1;

option go_package = "github.com/endzyme/the-tyler/proto/gen/tyler/v1;tylerv1";

import "google/protobuf/timestamp.proto";

// AllowlistSnapshot is the full current set of authorized networks for the
// receiving client. The web app streams this to each connected sync client
// whenever the allowlist changes. The sync client always applies the full
// snapshot — there are no incremental updates.
message AllowlistSnapshot {
  // ips is the global set of user-authorized hosts (bare IPv4 addresses and
  // IPv6 /64 prefixes). It is identical for every client.
  repeated string ips = 1;
  google.protobuf.Timestamp generated_at = 2;
  // cidrs are operator-assigned networks scoped to the API key this stream
  // authenticated with. They are not tied to any user and do not expire; the
  // client consolidates them with its own local static ranges. Different keys
  // receive different cidrs.
  repeated string cidrs = 3;
}

message SubscribeRequest {
  // client_version is the release version of the connecting sync client (the
  // value baked in at build time, e.g. "v1.4.0" or "dev"). It is reported for
  // operator visibility on the admin panel and is otherwise not acted upon.
  // Older clients that predate version reporting send an empty string.
  string client_version = 1;
}

service AllowlistService {
  // Subscribe opens a long-lived server-streaming RPC. The server pushes a
  // fresh AllowlistSnapshot immediately on connect and again on every change.
  rpc Subscribe(SubscribeRequest) returns (stream AllowlistSnapshot);
}
